# Main-stack overlay for minco_shadow. It is loaded directly after the legacy
# profile; all active MINCO parameters belong to the /minco_shadow sidecar.
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: $(find-pkg-share pb2025_nav_bringup)/behavior_trees/navigate_to_pose_w_minco_shadow.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share pb2025_nav_bringup)/behavior_trees/navigate_through_poses_w_minco_shadow.xml
    plugin_lib_names: ["minco_shadow_goal_relay_bt_node"]

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "intensity_voxel_layer", "denoise_layer", "inflation_layer"]

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "intensity_voxel_layer", "denoise_layer", "inflation_layer"]
