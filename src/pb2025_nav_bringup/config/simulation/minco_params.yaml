    max_delta_z: 0.25
    max_delta_yaw: 0.1745329252 # 10 deg
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
    robot_base_frame: "gimbal_yaw"
    lidar_frame: "left_mid360"
