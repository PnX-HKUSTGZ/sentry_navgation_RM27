# Standalone rm_simulation.launch.py defaults. Combined navigation uses the
# selected launch_bringup/config/simulation/{nav2_params,minco_params}.yaml.
# auto: try hardware OpenGL, warn and fall back to CPU llvmpipe.
# gpu: require hardware OpenGL; fail startup if unavailable.
# cpu: require software llvmpipe. This affects rendering only.
simulation_rendering:
  ros__parameters:
    render_mode: auto
