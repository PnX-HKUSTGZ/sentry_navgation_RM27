terrain_analysis:
  ros__parameters:
    scanVoxelSize: 0.05                 # 点云下采样
    decayTime: 0.8  # 点云保留时长；实车缩短以减少残留，单位：秒。
    noDecayDis: 0.0  # 此距离内不按时间衰减，单位：米。
    clearingDis: 0.0                    # 该距离外的点会被清除
    useSorting: true  # 以高度分位点估计地面，支持坡面；勿与 considerDrop 同时开启。
    quantileZ: 0.2  # 启用高度排序时的地面分位数。
    considerDrop: false  # 是否按相对地面的绝对高度检测凹陷。
    limitGroundLift: false
    maxGroundLift: 0.3
    clearDyObs: true  # 清除动态物体留下的过期点。
    minDyObsDis: 0.3  # 下方动态清除参数需开启 clearDyObs。
    minDyObsAngle: 0.0
    minDyObsRelZ: -0.3
    absDyObsRelZThre: 0.2
    minDyObsVFOV: -28.0
    maxDyObsVFOV: 33.0
    minDyObsPointNum: 1
    noDataObstacle: false  # 是否将无数据区域视作障碍。
    noDataBlockSkipNum: 0
    minBlockPointNum: 8                # 提高局部平面栅格最少点数，过滤稀疏孤立噪点
    # 传统地形链按相对地面高度过滤顶部回波；maxRelZ 仅限制输入点云范围。
    vehicleHeight: 0.45
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 2.0            # 更频繁清理过期点，避免假障碍在 terrain_map 里拖尾
    minRelZ: -1.5  # 与 maxRelZ 共同限定有效点云的相对高度。
    maxRelZ: 0.5
    disRatioZ: 0.2  # 相对高度范围随距离扩展，以适应坡面。

terrain_analysis_ext:
  ros__parameters:
    scanVoxelSize: 0.1
    decayTime: 0.2
    noDecayDis: 0.0
    clearingDis: 20.0
    useSorting: true
    quantileZ: 0.2
    # 与局部传统地形链保持同一顶部过滤阈值。
    vehicleHeight: 0.45
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 0.8  # 全局地形点云的过期清理周期，单位：秒。
    lowerBoundZ: -1.5
